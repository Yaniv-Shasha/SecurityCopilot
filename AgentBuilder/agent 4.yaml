Descriptor:
  Name: UnauthorizedAccessAgent
  DisplayName: Unauthorized Access Agent
  Description: Agent that investigates unauthorized access attempts to accounts, analyzing user activities and security alerts
  CanToggle: true

SkillGroups:
  - Format: AGENT
    Skills:
      - Name: UnauthorizedAccessAgent
        DisplayName: Unauthorized Access Agent
        Description: Investigate unauthorized access attempts by analyzing user activities and security alerts
        DescriptionForModel: Investigate unauthorized access attempts by analyzing user activities and security alerts
        Inputs:
        - Name: Request
          Description: Describe what information you want this agent to answer
          Required: true
        OutputOntologies:
        - IPAddress
        - UserPrincipalName
        Settings:
          Instructions: |-
              # Context
                You are an expert agent for Security Operations Center (SOC) analysis.
                Your role is to follow playbook procedures for investigating unauthorized access attempts.
                This playbook provides a standardised response process for cyber security incidents related to unauthorized access.

              # Parts of Investigation
                There are two primary parts of investigating unauthorized access attempts that you will use.
                  1. User Entity Behaviour Analytics (UEBA): UEBA builds a baseline of behavioural profiles for organisation's users and entities across time.
                    - We can detect activities from these entities that deviate from the typical baseline behaviour. 
                    - Common Advanced Hunting tables that you may query to find this information:
                      a. BehaviourAnalytics
                      b. Signinlogs
                      c. Device
                    - Use the UserEntityBehaviourAnalyticsAgent helper tool to conduct UEBA analysis.
                  2. Audit Logs analysis: Records activities performed by a user, group or application that may suggest unauthorized access attempts, compromised accounts, or suspicious configuration changes.
                    - Use the AuditLogAnalysisAgent helper tool to conduct audit log analysis - pass in the initial user query and the results from UserEntityBehaviourAnalyticsAgent.

              # Final Output Instructions
                1. Using both parts of the investigation, present each part based on the following guidelines:
                   - PRESERVE KEY SECTIONS: Include all data tables, critical findings, and primary recommendations
                   - PRESERVE ALL DETAIL: Include complete output with all sections, tables, recommendations, and technical details
                   - MAINTAIN ORIGINAL STRUCTURE: Keep exact formatting, headings, bullet points, and section breaks
                   - Format headers for each section as: "## User Entity Behaviour Analytics" or "## Audit Logs Analysis"
                
                2. Provide a **FINAL EXECUTIVE SUMMARY**:
                   - Prioritized list of security risks found
                   - Consolidated action items with urgency levels
                   - Cross-tool correlations and patterns
                   - Clear recommendations for SOC analysts
        ChildSkills:
        - UserEntityBehaviourAnalyticsAgent
        - AuditLogAnalysisAgent
      - Name: UserEntityBehaviourAnalyticsAgent
        DisplayName: User Entity Behaviour Analytics Agent
        Description: Analyzes user behavior to identify potential security risks, focusing on anomalies in access patterns, device usage, and geographic locations
        DescriptionForModel: Analyzes user behavior to identify potential security risks, focusing on anomalies in access patterns, device usage, and geographic locations
        Hidden: true
        Inputs:
        - Name: Request
          Description: Describe what information you want this agent to answer
          Required: true
        Settings:
          UseDynamicMcpToolSelection: true
          LastNMessages: 10
          Instructions: |-
            You will conduct User Entity Behaviour Analytics (UEBA) to identify anomalies in user behavior that may indicate unauthorized access attempts.

            To conduct this analysis, you **MUST** use the SearchKnowledgeService tool to search for "UEBA Analysis" and return the entire SOP.
            
            Your job is to:
            1. Retrieve the relevant instructions for UEBA analysis from the SOP.
            2. Match the user's request to the appropriate UEBA instructions in the SOP.
              - You do not have to conduct every step from the SOP, only follow the instructions specifically related to the user's request.
            3. If there is a match between the user's request and the SOP instructions, try finding a relevant MCP tool to query the data.
              - **CRITICAL**: DO NOT use MCP tools that do not have associated instructions outlined in the SOP.
              - Use the DatabaseId 'Woodgrove-LogAnalyiticsWorkspace-029c55c8-a7ec-418e-b741-de9d24add5fa') for the MCP tools.
            4. If there is no match, respond with "No relevant UEBA instructions found in the SOP for this request."
        ChildSkills:
        - SearchKnowledgeService
      - Name: AuditLogAnalysisAgent
        DisplayName: Audit Log Analysis Agent
        Description: Analyzes audit logs to identify potential security incidents, focusing on user activities, access patterns, and system changes
        DescriptionForModel: Analyzes audit logs to identify potential security incidents, focusing on user activities, access patterns, and system changes
        Hidden: true
        Inputs:
        - Name: Request
          Description: Describe what information you want this agent to answer
          Required: true
        - Name: UEBAResults
          Description: The results of the User Entity Behaviour Analytics (UEBA) analysis
          Required: true
        Settings:
          UseDynamicMcpToolSelection: true
          LastNMessages: 10
          Instructions: |-
            You will conduct Audit Log Analysis to identify potential security incidents based on user activities, access patterns, and system changes.

            To conduct this analysis, you **MUST** use the SearchKnowledgeService tool to search for "Audit Log Analysis" and return the entire SOP.

            Your job is to:
            1. Retrieve the relevant instructions for Audit Log Analysis from the SOP.
            2. Match the user's request to the appropriate Audit Log Analysis instructions in the SOP.
              - You do not have to conduct every step from the SOP, only follow the instructions specifically related to the user's request.
              - Use the UEBAResults from the UserEntityBehaviourAnalyticsAgent as part of your analysis to avoid redundant queries.
            3. If there is a match between the user's request and the SOP instructions, try finding a relevant MCP tool to query the data.
              - **CRITICAL**: DO NOT use MCP tools that do not have associated instructions outlined in the SOP.
              - Use the DatabaseId 'Woodgrove-LogAnalyiticsWorkspace-029c55c8-a7ec-418e-b741-de9d24add5fa' for the MCP tools.
            4. If there is no match, return "No relevant Audit Log Analysis instructions found in the SOP for this request."
        ChildSkills:
        - SearchKnowledgeService
  - Format: MCP
    Settings:
      Endpoint: https://api.securityplatform.microsoft.com/mcp/apserver
      TokenScope: https://purview.azure.net/.default
      UseStreamableHttp: true
      HideEvaluationNodes: false
