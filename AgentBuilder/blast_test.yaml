  DisplayName: Phish URL Blast Radius Agent 2025
  Description: Identify users who clicked on a phishing URL and assess the scope of the blast radius. The Agent utilizes the calculation file 'BlastRadiusAgentCalculations.docx', which must be available in the Files section and accessible to the user running the agent.
  Publisher: Microsoft
  Product: Security Copilot
  FeatureFlags:
  - EnablePhishURLBlastRadiusAgent
