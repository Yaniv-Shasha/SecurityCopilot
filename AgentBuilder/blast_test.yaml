  Description: Identify users who clicked on a phishing URL and assess the scope of the blast radius
  DescriptionDisplay: Identify users who clicked on a phishing URL and assess the scope of the blast radius
  DescriptionForModel: Check who clicked on a phishing URL and understand the involved Users blast radius
  Category: Microsoft
  UserVisibilityFeatureFlags:
  - EnablePhishURLBlastRadiusAgent
  UserVisibility: IfFeatureFlagsEnabled
  PlannerVisibilityFeatureFlags:
