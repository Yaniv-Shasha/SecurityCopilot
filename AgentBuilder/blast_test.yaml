    - M365
    - FileUploads
    - Sentinel
    - PhishURLBlastRadiusAgent2025
    - Agents
  AgentSingleInstanceConstraint: Workspace
  Triggers:
    - Name: Default
      DefaultPeriodSeconds: 0
      ProcessSkill: PhishURLBlastRadiusAgent2025.PhishURLBlastRadiusAgent
      Settings:
        - Name: Url
          Description: The phishing URL clicked-on
          Required: true
